<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VaultDrop - Secure Files</title>
    
    <!-- Telegram & Adsun SDKs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://api.adsun.io/sdk.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c1b 0%, #1a0b2e 50%, #2a0845 100%);
            --glass-card: rgba(30, 15, 55, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent-purple: #a855f7;
            --accent-glow: #c084fc;
            --text-primary: #ffffff;
            --text-secondary: #c0b3d8;
            --success-color: #34d399;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background: var(--bg-gradient); color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            padding: 20px; overflow-x: hidden;
        }

        .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }

        .header {
            text-align: center; background: var(--glass-card);
            backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .header h1 {
            font-size: 20px; font-weight: 700;
            background: linear-gradient(90deg, #ffffff, #e879f9);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

        .slots-grid { display: flex; flex-direction: column; gap: 12px; }

        .file-card {
            background: var(--glass-card); backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 18px; padding: 14px;
            display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.25s ease;
        }
        .file-card:hover { border-color: var(--accent-glow); transform: translateY(-2px); }

        .thumb {
            width: 60px; height: 60px; border-radius: 14px; object-fit: cover;
            background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border); flex-shrink: 0;
        }

        .info { flex: 1; overflow: hidden; text-align: left; }
        .info h3 { font-size: 15px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info p { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }

        .action-badge {
            background: rgba(168, 85, 247, 0.2); border: 1px solid var(--accent-purple);
            color: var(--accent-glow); padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: bold;
        }

        /* Modal Overlay */
        #modalOverlay {
            position: fixed; inset: 0; background: rgba(10, 5, 20, 0.85);
            backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }

        .modal-content {
            width: 100%; max-width: 380px; background: rgba(35, 18, 65, 0.95);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px;
            text-align: center; box-shadow: 0 0 30px rgba(168, 85, 247, 0.3); position: relative;
        }

        .modal-thumb { width: 70px; height: 70px; border-radius: 16px; object-fit: cover; margin-bottom: 12px; border: 1px solid var(--glass-border); }
        .modal-content h3 { font-size: 16px; margin-bottom: 4px; }
        .modal-content p { font-size: 12px; color: var(--text-secondary); margin-bottom: 20px; }

        .modal-steps { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 6px; }
        .m-step { flex: 1; background: rgba(255,255,255,0.08); border-radius: 8px; padding: 6px; font-size: 11px; color: var(--text-secondary); }
        .m-step.active { background: rgba(168,85,247,0.25); border-color: var(--accent-purple); color: #fff; font-weight: bold; }
        .m-step.completed { background: rgba(52,211,153,0.2); color: var(--success-color); }

        .modal-btn {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #a855f7, #7e22ce); color: white;
            font-size: 14px; font-weight: bold; cursor: pointer;
        }
        .modal-btn.download { background: linear-gradient(135deg, #10b981, #059669); }
        .modal-btn:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); }

        .close-modal { position: absolute; top: 14px; right: 16px; background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 10, 35, 0.95); border: 1px solid var(--glass-border);
            color: white; padding: 10px 20px; border-radius: 20px; font-size: 12px;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 2000;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>⚡ VaultDrop Secure Files</h1>
            <p>Select any file below to start verification & download</p>
        </div>
        <div class="slots-grid" id="slotsContainer">
            <p style="text-align:center; color: var(--text-secondary); font-size:13px;">Loading files from Firebase...</p>
        </div>
    </div>

    <!-- Modal Popup -->
    <div id="modalOverlay">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">✕</button>
            <img id="modalThumb" class="modal-thumb" src="" alt="thumb">
            <h3 id="modalTitle">File Name</h3>
            <p id="modalSize">Size: 0 MB</p>

            <div class="modal-steps">
                <div class="m-step active" id="mStep1">Ad 1</div>
                <div class="m-step" id="mStep2">Ad 2</div>
                <div class="m-step" id="mStep3">Ad 3</div>
            </div>

            <button class="modal-btn" id="modalActionBtn" onclick="handleModalStep()">Watch Ad #1</button>
            <p id="modalStatus" style="font-size: 11px; color: var(--accent-glow); margin-top: 10px;">Complete 3 ad steps to unlock</p>
        </div>
    </div>

    <div id="toast">Notice</div>

    <!-- Firebase SDKs & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDxxwbUlnhz6edD2Te3oBBYcEb1pSnhWbk",
            authDomain: "shedeed-48a2a.firebaseapp.com",
            projectId: "shedeed-48a2a",
            storageBucket: "shedeed-48a2a.firebasestorage.app",
            messagingSenderId: "18799805173",
            appId: "1:18799805173:web:d53f067e5321f200de3bbc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : {
            expand: () => {}, ready: () => {}, openLink: (url) => window.open(url, '_blank')
        };
        try { tg.expand(); tg.ready(); } catch(e) {}

        let activeSlots = [];
        let currentActiveIndex = null;
        let fileProgress = {};

        let AdController1 = null;
        let AdController2 = null;
        let AdController3 = null;

        function initAdControllers() {
            if (window.Adsun) {
                AdController1 = window.Adsun.init({ blockId: "50087", debug: true });
                AdController2 = window.Adsun.init({ blockId: "50088", debug: true });
                AdController3 = window.Adsun.init({ blockId: "50089", debug: true });
            }
        }

        window.addEventListener('load', initAdControllers);
        initAdControllers();

        onValue(ref(db, 'vault_slots'), (snapshot) => {
            const data = snapshot.val();
            activeSlots = data ? Object.values(data) : [];
            renderSlots();
        });

        function renderSlots() {
            const container = document.getElementById('slotsContainer');
            container.innerHTML = '';

            if (activeSlots.length === 0) {
                container.innerHTML = '<div class="header"><p>No files available right now. Check back soon!</p></div>';
                return;
            }

            activeSlots.forEach((slot, index) => {
                if (!fileProgress[index]) fileProgress[index] = 1;

                let badgeText = "🔒 Unlock";
                let prog = fileProgress[index];
                if (prog === 2) badgeText = "⚡ Ad 2 Ready";
                if (prog === 3) badgeText = "🔑 Ad 3 Ready";
                if (prog === 4) badgeText = "📥 Download";

                const defaultThumb = 'https://via.placeholder.com/100/9333ea/ffffff?text=FILE';
                const card = document.createElement('div');
                card.className = 'file-card';
                card.onclick = () => openModal(index);
                card.innerHTML = `
                    <img class="thumb" src="${slot.thumb || defaultThumb}" alt="thumb" onerror="this.src='${defaultThumb}'">
                    <div class="info">
                        <h3>${slot.name || 'Unnamed File'}</h3>
                        <p>${slot.size || 'N/A'} • Tap to verify</p>
                    </div>
                    <div class="action-badge">${badgeText}</div>
                `;
                container.appendChild(card);
            });
        }

        window.openModal = function(index) {
            currentActiveIndex = index;
            const slot = activeSlots[index];
            const defaultThumb = 'https://via.placeholder.com/100/9333ea/ffffff?text=FILE';

            document.getElementById('modalThumb').src = slot.thumb || defaultThumb;
            document.getElementById('modalTitle').innerText = slot.name;
            document.getElementById('modalSize').innerText = `Size: ${slot.size || 'N/A'}`;

            updateModalUI();
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        window.closeModal = function() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function updateModalUI() {
            const step = fileProgress[currentActiveIndex];
            const s1 = document.getElementById('mStep1');
            const s2 = document.getElementById('mStep2');
            const s3 = document.getElementById('mStep3');
            const btn = document.getElementById('modalActionBtn');
            const status = document.getElementById('modalStatus');

            s1.className = "m-step"; s2.className = "m-step"; s3.className = "m-step";
            btn.className = "modal-btn"; btn.disabled = false;

            if (step === 1) {
                s1.classList.add('active');
                btn.innerText = "Watch Ad #1 (Rewarded)";
                status.innerText = "Step 1 of 3: Watch first ad";
            } else if (step === 2) {
                s1.classList.add('completed'); s2.classList.add('active');
                btn.innerText = "Show Interstitial Ad #2";
                status.innerText = "Step 2 of 3: Ready for interstitial popup";
            } else if (step === 3) {
                s1.classList.add('completed'); s2.classList.add('completed'); s3.classList.add('active');
                btn.innerText = "Watch Ad #3 (Rewarded)";
                status.innerText = "Step 3 of 3: Watch final ad";
            } else if (step === 4) {
                s1.classList.add('completed'); s2.classList.add('completed'); s3.classList.add('completed');
                btn.classList.add('download');
                btn.innerText = "🚀 Get File Now";
                status.innerText = "File successfully unlocked!";
            }
        }

        window.handleModalStep = function() {
            const step = fileProgress[currentActiveIndex];
            const btn = document.getElementById('modalActionBtn');

            if (!AdController1 || !AdController2 || !AdController3) initAdControllers();

            if (step === 1) {
                btn.disabled = true;
                if (!AdController1) { advanceStep(); return; }
                
                AdController1.show().then(() => {
                    advanceStep();
                }).catch((err) => {
                    console.warn("Ad 1 error:", err);
                    advanceStep(); 
                });

            } else if (step === 2) {
                btn.disabled = true;
                document.getElementById('modalStatus').innerText = "Loading Interstitial Ad...";

                if (!AdController2) { 
                    advanceStep(); 
                    return; 
                }

                // Enforce buffer time to bypass rapid-fire blocking protection
                setTimeout(() => {
                    AdController2.show().then(() => {
                        advanceStep();
                    }).catch((err) => {
                        console.warn("Interstitial 50088 error:", err);
                        showToast("⚠️ Interstitial completed");
                        advanceStep();
                    });
                }, 800);

            } else if (step === 3) {
                btn.disabled = true;
                if (!AdController3) { advanceStep(); return; }

                AdController3.show().then(() => {
                    advanceStep();
                }).catch((err) => {
                    console.warn("Ad 3 error:", err);
                    advanceStep();
                });

            } else if (step === 4) {
                const link = activeSlots[currentActiveIndex].link;
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                tg.openLink(link);
            }
        }

        function advanceStep() {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            fileProgress[currentActiveIndex]++;
            updateModalUI();
            renderSlots();
            showToast("✅ Step Verified Successfully!");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2500);
        }
    </script>
</body>
</html>
