<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gem Miner T2E</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1e1e1e);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }

        .score-container { text-align: center; margin-bottom: 30px; }
        .score-title { font-size: 16px; color: var(--hint-color); text-transform: uppercase; letter-spacing: 1px; }
        .score-value { font-size: 48px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .tap-area {
            position: relative; width: 220px; height: 220px;
            display: flex; align-items: center; justify-content: center;
            font-size: 110px; cursor: pointer;
            background: radial-gradient(circle, rgba(51,144,236,0.2) 0%, transparent 70%);
            border-radius: 50%;
            transition: transform 0.05s ease;
        }
        .tap-area:active { transform: scale(0.95); }

        .floating-text {
            position: absolute; font-size: 24px; font-weight: bold; color: #4CAF50;
            pointer-events: none; animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }

        /* Optional Bonus Ad Button (Clearly marked as optional extra reward) */
        .ad-btn {
            margin-top: 40px; width: 85%; max-width: 320px;
            padding: 15px; border: none; border-radius: 12px;
            background: var(--button-color); color: var(--button-text);
            font-size: 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: background 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .ad-btn:active { transform: scale(0.98); }
        .ad-btn:disabled { background: var(--hint-color); cursor: not-allowed; }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="score-container">
        <div class="score-title">Gems Mined</div>
        <div class="score-value">💎 <span id="score">0</span></div>
    </div>

    <!-- Core Action: Fully free, unlimited tapping -->
    <div class="tap-area" id="tapObject" onclick="handleTap(event)">
        💎
    </div>

    <!-- Optional Bonus Button -->
    <button class="ad-btn" id="adBtn" onclick="watchAd()">
        📺 Watch Optional Bonus Ad (+500 Gems)
    </button>

    <div id="toast">Reward Claimed!</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let score = 0;
        const scoreEl = document.getElementById('score');
        const tapObject = document.getElementById('tapObject');
        const adBtn = document.getElementById('adBtn');

        // Core Action works 100% freely without restrictions or ads
        function handleTap(event) {
            score += 1;
            scoreEl.innerText = score.toLocaleString();

            const rect = tapObject.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            const plusOne = document.createElement('div');
            plusOne.classList.add('floating-text');
            plusOne.innerText = "+1";
            plusOne.style.left = `${x}px`;
            plusOne.style.top = `${y}px`;
            
            tapObject.appendChild(plusOne);
            setTimeout(() => { plusOne.remove(); }, 1000);
            
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        // Adsgram Initialization (debug: false for production)
        const AdController = window.Adsgram.init({
            blockId: "56215", 
            debug: false 
        });

        // Optional Ad Trigger (Purely bonus, never required for app actions)
        function watchAd() {
            adBtn.disabled = true;
            adBtn.innerText = "Loading Bonus Ad...";

            AdController.show().then(() => {
                score += 500;
                scoreEl.innerText = score.toLocaleString();
                showToast("✅ +500 Bonus Gems Claimed!");
                adBtn.innerText = "📺 Watch Optional Bonus Ad (+500 Gems)";
                adBtn.disabled = false;
            }).catch((error) => {
                console.error("Ad error: ", error);
                showToast("❌ Ad skipped or failed.");
                adBtn.innerText = "📺 Watch Optional Bonus Ad (+500 Gems)";
                adBtn.disabled = false;
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.opacity = 1;
            setTimeout(() => { toast.style.opacity = 0; }, 3000);
        }
    </script>
</body>
</html>
