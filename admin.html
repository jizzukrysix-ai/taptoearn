<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultDrop Admin - Realtime Sync</title>
    <style>
        :root {
            --bg: #0d0714;
            --card: rgba(28, 15, 50, 0.85);
            --border: rgba(168, 85, 247, 0.3);
            --accent: #a855f7;
            --danger: #ef4444;
            --text: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }

        body {
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; justify-content: center; padding: 25px 15px;
        }

        .admin-card {
            width: 100%; max-width: 500px; background: var(--card);
            border: 1px solid var(--border); border-radius: 20px; padding: 25px;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.2); backdrop-filter: blur(12px);
        }

        h2 { text-align: center; margin-bottom: 20px; color: var(--accent); font-size: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #c0b3d8; margin-bottom: 5px; }
        input {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.4);
            border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 13px; outline: none;
        }
        input:focus { border-color: var(--accent); }

        .btn {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: var(--accent); color: white; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-danger { background: var(--danger); }

        #authOverlay {
            position: fixed; inset: 0; background: #0d0714;
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }

        .slot-item {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .slot-item img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
        .slot-details { flex: 1; margin-left: 12px; overflow: hidden; }
        .slot-details h5 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .slot-details p { font-size: 11px; color: #999; }
    </style>
</head>
<body>

    <!-- Security Authentication Modal -->
    <div id="authOverlay">
        <div class="admin-card" style="max-width: 350px;">
            <h2>🔒 Admin Protection</h2>
            <div class="input-group">
                <label>Enter Master Admin Password</label>
                <input type="password" id="adminPassword" placeholder="••••••••">
            </div>
            <button class="btn" onclick="verifyPassword()">Authenticate</button>
            <p id="authError" style="color:var(--danger); font-size:12px; text-align:center; margin-top:10px; display:none;">Invalid Security Hash!</p>
        </div>
    </div>

    <!-- Main Admin Panel -->
    <div class="admin-card" id="adminPanel" style="display: none;">
        <h2>⚙️ Firebase Slot Manager (Max 10)</h2>

        <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 14px; margin-bottom: 20px;">
            <h4 style="font-size: 14px; margin-bottom: 10px; color: var(--accent);">Add File Slot</h4>
            <div class="input-group"><label>File Name</label><input type="text" id="slotName" placeholder="e.g. Mod_Pack.zip"></div>
            <div class="input-group"><label>Thumbnail URL</label><input type="url" id="slotThumb" placeholder="https://..."></div>
            <div class="input-group"><label>File Size</label><input type="text" id="slotSize" placeholder="e.g. 45 MB"></div>
            <div class="input-group"><label>Download Link</label><input type="url" id="slotLink" placeholder="https://drive.google.com/..."></div>
            <button class="btn" id="saveBtn" onclick="saveSlot()">Save to Firebase</button>
        </div>

        <h4 style="font-size: 14px; margin-bottom: 10px;">Active Slots (<span id="slotCount">0</span>/10)</h4>
        <div id="slotsAdminList">Loading...</div>
    </div>

    <!-- Firebase Module Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDxxwbUlnhz6edD2Te3oBBYcEb1pSnhWbk",
            authDomain: "shedeed-48a2a.firebaseapp.com",
            projectId: "shedeed-48a2a",
            storageBucket: "shedeed-48a2a.firebasestorage.app",
            messagingSenderId: "18799805173",
            appId: "1:18799805173:web:d53f067e5321f200de3bbc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Default SHA-256 Hash for password "admin"
        const SECURITY_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";

        window.verifyPassword = async function() {
            const pwd = document.getElementById('adminPassword').value;
            const msgBuffer = new TextEncoder().encode(pwd);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashed = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

            if (hashed === SECURITY_HASH) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                initAdminSync();
            } else {
                document.getElementById('authError').style.display = 'block';
            }
        }

        let slotsDataObj = {};

        function initAdminSync() {
            onValue(ref(db, 'vault_slots'), (snapshot) => {
                const data = snapshot.val() || {};
                slotsDataObj = data;
                const keys = Object.keys(data);
                document.getElementById('slotCount').innerText = keys.length;

                const container = document.getElementById('slotsAdminList');
                container.innerHTML = '';

                if (keys.length === 0) {
                    container.innerHTML = '<p style="font-size:12px; color:#888;">No slots configured.</p>';
                    return;
                }

                keys.forEach((key) => {
                    const s = data[key];
                    const div = document.createElement('div');
                    div.className = 'slot-item';
                    div.innerHTML = `
                        <img src="${s.thumb || 'https://via.placeholder.com/45'}" alt="thumb">
                        <div class="slot-details">
                            <h5>${s.name}</h5>
                            <p>${s.size} • Link Configured</p>
                        </div>
                        <button class="btn btn-danger" style="padding: 6px 12px; font-size:11px; width:auto;" onclick="deleteSlot('${key}')">Delete</button>
                    `;
                    container.appendChild(div);
                });
            });
        }

        window.saveSlot = function() {
            const name = document.getElementById('slotName').value.trim();
            const thumb = document.getElementById('slotThumb').value.trim();
            const size = document.getElementById('slotSize').value.trim();
            const link = document.getElementById('slotLink').value.trim();

            if (!name || !link) {
                alert("File Name and Download Link are required!");
                return;
            }

            if (Object.keys(slotsDataObj).length >= 10) {
                alert("Maximum limit of 10 slots reached!");
                return;
            }

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.innerText = "Saving to Firebase...";

            const newSlotRef = push(ref(db, 'vault_slots'));
            set(newSlotRef, { name, thumb, size, link }).then(() => {
                document.getElementById('slotName').value = '';
                document.getElementById('slotThumb').value = '';
                document.getElementById('slotSize').value = '';
                document.getElementById('slotLink').value = '';
                saveBtn.disabled = false;
                saveBtn.innerText = "Save to Firebase";
                alert("File slot saved successfully!");
            }).catch((error) => {
                console.error("Save error:", error);
                alert("Failed to save slot. Check console.");
                saveBtn.disabled = false;
                saveBtn.innerText = "Save to Firebase";
            });
        }

        window.deleteSlot = function(key) {
            if (confirm("Are you sure you want to delete this file slot?")) {
                remove(ref(db, `vault_slots/${key}`)).catch((err) => {
                    console.error("Delete error:", err);
                    alert("Failed to delete.");
                });
            }
        }
    </script>
</body>
</html>
